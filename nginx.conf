# Nginx configuration for AIGrowth HQ

# Global settings
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging Settings
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main buffer=16k;
    error_log /var/log/nginx/error.log warn;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        application/json 
        application/javascript 
        application/rss+xml 
        application/atom+xml 
        image/svg+xml;

    # Server configuration
    server {
        listen 80;
        listen [::]:80;
        server_name aigrowth.ai www.aigrowth.ai;

        # Redirect HTTP to HTTPS (uncomment when SSL is available)
        # return 301 https://$server_name$request_uri;

        root /a0/usr/workdir/aigrowth-hq/public;
        index index.html;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # Content Security Policy
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
            style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
            img-src 'self' data:;
            font-src 'self' https://fonts.gstatic.com;
        " always;

        # Static Files Caching
        location ~* (html|css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf|eot)$ {
            expires max;
            log_not_found off;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Pragma "cache" always;
        }

        # Main location block
        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # Error Pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        # Security: Prevent access to sensitive files
        location ~ /(ht|git|env) {
            deny all;
        }

        # Disable logging for common files
        location = /favicon.ico { 
            log_not_found off; 
            access_log off; 
        }
        location = /robots.txt { 
            log_not_found off; 
            access_log off; 
        }
    }
}