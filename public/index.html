<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIGrowth HQ - Transform Your Business with AI</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #000428, #004e92);
            color: white;
        }
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .typing-effect {
            border-right: .15em solid white;
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3s steps(40, end), blink-caret .75s step-end infinite;
        }
        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }
        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: white }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="container mx-auto max-w-4xl glassmorphism p-8 shadow-2xl text-center">
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-r from-blue-900/30 to-purple-900/30 opacity-50 blur-3xl"></div>
        
        <h1 id="heroHeadline" class="text-4xl md:text-6xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-600 typing-effect">
            Unleash AI-Powered Growth
        </h1>
        
        <p id="subHeadline" class="text-xl md:text-2xl mb-8 text-gray-300">
            Transform Your Business with Cutting-Edge AI Technologies
        </p>
        
        <div class="flex justify-center space-x-4 mb-8">
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full transition duration-300 transform hover:scale-105 shadow-lg">
                Get Started
            </button>
            <button class="bg-transparent border-2 border-white/30 hover:bg-white/10 text-white font-bold py-3 px-6 rounded-full transition duration-300 transform hover:scale-105">
                Learn More
            </button>
        </div>
        
        <div class="bg-white/5 p-4 rounded-xl inline-block">
            <p class="text-sm text-gray-400">
                🚀 AI Projects Transformed: 
                <span id="liveCounter" class="text-blue-400 font-bold ml-2">0</span>
            </p>
        </div>

        <div class="mt-12 grid md:grid-cols-2 gap-4">
            <div class="bg-white/10 p-6 rounded-xl">
                <blockquote class="italic mb-4">"AIGrowth HQ revolutionized our content strategy!"</blockquote>
                <div class="text-sm">
                    <span class="font-bold">Sarah K.</span>
                    <span class="text-gray-500 ml-2">| TechInnovate</span>
                </div>
            </div>
            <div class="bg-white/10 p-6 rounded-xl">
                <blockquote class="italic mb-4">"Unbelievable AI-driven growth in just weeks!"</blockquote>
                <div class="text-sm">
                    <span class="font-bold">Michael R.</span>
                    <span class="text-gray-500 ml-2">| GlobalSolutions</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function generateDynamicContent() {
            const heroHeadlines = [
                "Unleash AI-Powered Business Transformation",
                "AI: Your Competitive Edge Starts Here",
                "Revolutionize Your Strategy with Intelligent AI"
            ];
            const subHeadlines = [
                "Cutting-Edge AI Technologies for Unprecedented Growth",
                "Intelligent Solutions That Drive Business Forward",
                "Transform Challenges into Opportunities with AI"
            ];

            const heroHeadline = heroHeadlines[Math.floor(Math.random() * heroHeadlines.length)];
            const subHeadline = subHeadlines[Math.floor(Math.random() * subHeadlines.length)];

            document.getElementById('heroHeadline').textContent = heroHeadline;
            document.getElementById('subHeadline').textContent = subHeadline;
        }

        function updateLiveCounter() {
            const counterEl = document.getElementById('liveCounter');
            let count = 0;
            setInterval(() => {
                count += Math.floor(Math.random() * 5);
                counterEl.textContent = count.toLocaleString();
            }, 1000);
        }

        // Initialize dynamic content and counter
        generateDynamicContent();
        updateLiveCounter();
    </script>
</body>
</html>
